<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Hesti Ruwaida 🤍</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        canvas {
            position: absolute;
            inset: 0;
        }

        .message {
            position: absolute;
            bottom: 8%;
            text-align: center;
            z-index: 10;
            animation: fadeIn 3s ease forwards;
        }

        .name {
            color: #af1a30;
            font-size: clamp(22px, 5vw, 42px);
            font-weight: bold;
            letter-spacing: 6px;

            text-shadow:
                0 0 5px #ffb6c1,
                0 0 15px #ff8fa3,
                0 0 30px #ff5c7a;

            animation: glow 2s ease-in-out infinite alternate;
        }

        .sub {
            margin-top: 8px;
            color: #fff;
            font-size: 13px;
            letter-spacing: 3px;
            opacity: 0.7;
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 5px #ffb6c1,
                    0 0 15px #ff8fa3;
            }

            to {
                text-shadow:
                    0 0 10px #ffb6c1,
                    0 0 25px #ff6f91,
                    0 0 45px #ff416c;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <canvas id="loveCanvas"></canvas>

    <div class="message">
        <div class="name">HESTI RUWAIDA</div>
        <div class="sub">cieee tar lagi mau 20thn rekkk, wkwkw</div>
    </div>

    <script>

        const canvas = document.getElementById("loveCanvas");
        const ctx = canvas.getContext("2d");

        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        resize();

        window.addEventListener("resize", resize);


        // =====================================
        // HEART PARAMETER
        // =====================================

        function heartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }

        function heartY(t) {
            return (
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t)
            );
        }


        // =====================================
        // PARTICLES
        // =====================================

        const particles = [];

        for (let i = 0; i < 80; i++) {

            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,

                size: Math.random() * 2 + 0.5,

                speed: Math.random() * 0.5 + 0.2,

                alpha: Math.random(),

                direction: Math.random() > 0.5 ? 1 : -1
            });

        }


        // =====================================
        // DRAW HEART
        // =====================================

        function drawHeart(time) {

            ctx.clearRect(0, 0, width, height);

            const centerX = width / 2;

            // Posisi love agak ke atas
            const centerY = height / 2 - 60;

            // Ukuran love
            const scale = Math.min(width, height) * 0.020;


            // =================================
            // BACKGROUND GLOW
            // =================================

            const gradient = ctx.createRadialGradient(
                centerX,
                centerY,
                20,
                centerX,
                centerY,
                scale * 18
            );

            gradient.addColorStop(0, "rgba(255, 105, 135, 0.12)");
            gradient.addColorStop(1, "rgba(255, 105, 135, 0)");

            ctx.fillStyle = gradient;

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            // =================================
            // HEART PULSE
            // =================================

            const pulse =
                1 +
                Math.sin(time * 0.003) * 0.035;


            // =================================
            // TEXT LOVE
            // =================================

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.font = "bold 9px Arial";

            ctx.fillStyle = "#ffb6c1";

            ctx.shadowColor = "#ff7895";
            ctx.shadowBlur = 8;


            // Banyak lapisan supaya love
            // terlihat padat seperti gambar
            for (let layer = 0; layer < 7; layer++) {

                const offset = layer * 0.012;

                for (let i = 0; i < 180; i++) {

                    const t =
                        (i / 180) *
                        Math.PI *
                        2;

                    const x =
                        heartX(t + offset) *
                        scale *
                        pulse;

                    const y =
                        -heartY(t + offset) *
                        scale *
                        pulse;


                    // Sedikit variasi posisi
                    const randomX =
                        (Math.random() - 0.5) * 2;

                    const randomY =
                        (Math.random() - 0.5) * 2;


                    ctx.fillText(
                        "I love you",
                        centerX + x + randomX,
                        centerY + y + randomY
                    );
                }
            }


            ctx.shadowBlur = 0;


            // =================================
            // FLOATING PARTICLES
            // =================================

            particles.forEach(p => {

                p.y -= p.speed;

                if (p.y < 0) {
                    p.y = height;
                    p.x = Math.random() * width;
                }

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(255,182,193,${p.alpha})`;

                ctx.shadowColor = "#ff9eb5";
                ctx.shadowBlur = 8;

                ctx.fill();

            });

            ctx.shadowBlur = 0;


            // =================================
            // SMALL HEARTS FLOATING
            // =================================

            for (let i = 0; i < 8; i++) {

                const x =
                    width * (i + 1) / 9;

                const y =
                    height -
                    ((time * 0.03 + i * 100) %
                    height);

                ctx.font = "14px Arial";

                ctx.fillStyle =
                    "rgba(255,150,170,0.5)";

                ctx.fillText(
                    "♡",
                    x,
                    y
                );
            }


            requestAnimationFrame(drawHeart);
        }


        requestAnimationFrame(drawHeart);

    </script>

</body>
</html>
